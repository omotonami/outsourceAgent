# Quyền ghi theo vùng. '*' = mọi agent (chỉ append).
zones:
  lead_brief: {writers: ["intake"], mode: owner_write}  # Nguồn gốc, không sửa sau khi tạo
  business_context: {writers: ["a1_bu"], mode: owner_write}
  estimate: {writers: ["a2_estimation"], mode: owner_write}  # Versioned
  proposal: {writers: ["a3_proposal"], mode: owner_write}
  gate_signatures: {writers: ["gate_ui"], mode: owner_write}  # Agent không có quyền ghi
  requirements: {writers: ["b1_ba"], mode: owner_write}
  ui_system: {writers: ["b3_ui"], mode: owner_write}
  design_spec: {writers: ["b2_ux"], mode: owner_write}
  architecture: {writers: ["b4_tech_lead"], mode: owner_write}
  task_backlog: {writers: ["b4_tech_lead", "orchestrator"], mode: owner_write}  # Orchestrator cập nhật trạng thái task
  build_results: {writers: ["c1_dev", "c2_tester", "c3_qc", "orchestrator"], mode: owner_write}  # Mỗi bên một field con
  security_report: {writers: ["d1_soc"], mode: owner_write}
  project_status: {writers: ["orchestrator"], mode: owner_write}
  risk_register: {writers: ["*"], mode: append_only}  # Append-only, có source_agent; chỉ PM đổi status
  revision_log: {writers: ["*"], mode: append_only}
  trace_log: {writers: ["gateway", "orchestrator"], mode: append_only}  # Append-only. orchestrator: Dispatcher (H2) ghi SPAWN/RESULT/BLOCKED/KILL cho Team feed
  clarify_answers: {writers: ["clarify"], mode: owner_write}
