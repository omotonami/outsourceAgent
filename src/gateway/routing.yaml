# Routing deterministic theo (agent, task_type, risk_level). Không dùng LLM để chọn LLM.
tiers: [haiku, sonnet, opus]
escalate_on: [schema_fail_twice, reflection_fail, high_risk, retry_2, variance_gt_30pct]
agents:
  intake:        {default: haiku}
  a1_bu:         {default: sonnet, escalate_to: opus}
  a2_estimation: {default: sonnet, escalate_to: opus}
  a3_proposal:   {draft: sonnet, final_review: opus}
  b1_ba:         {default: sonnet, escalate_to: opus}
  b3_ui:        {default: sonnet, escalate_to: opus}
  b2_ux:   {default: sonnet}
  b4_tech_lead:  {default: opus}
  c1_dev:        {default: sonnet, escalate_to: opus}
  c2_tester:     {generate: sonnet, summarize: haiku}
  c3_qc:         {default: same_or_higher_than_generator, high_risk: opus}
  e1_pm:         {summary: haiku, alerts: sonnet}
  d1_soc:        {triage: haiku, remediation: sonnet}
